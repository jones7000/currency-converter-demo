# Minimal static-file server for the Angular production build. No SPA
# fallback route is needed -- the app is a single page with no client-side
# router.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Rendered fresh by docker/entrypoint.sh on every container start; never
    # let the browser cache a stale backend URL.
    location = /env.js {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
